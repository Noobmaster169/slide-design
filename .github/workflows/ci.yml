name: figures
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Build and geometry-check every figure
        run: python3 bin/viz gallery          # exits non-zero if any figure has a geometry error
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm i playwright && npx playwright install --with-deps chromium
      - name: Exact check in a browser
        run: for f in gallery/*.svg; do node verify/measure.mjs "$f" || exit 1; done
      - name: Render PNGs for review
        run: python3 bin/viz gallery --png
      - uses: actions/upload-artifact@v4
        with: { name: figures, path: gallery/*.png }

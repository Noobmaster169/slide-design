name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  decks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: npm i -D playwright && npx playwright install --with-deps chromium
      - name: Regenerate example diagrams
        run: |
          for d in examples/*/; do
            for f in "$d"diagrams/*.py; do [ -e "$f" ] && python3 "$f"; done
          done
      - name: Render examples
        run: npm run render:examples
      - name: Check examples
        run: npm run check:examples
      - uses: actions/upload-artifact@v4
        with:
          name: slide-previews
          path: examples/*/preview/*.png
